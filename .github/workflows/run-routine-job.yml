# .github/workflows/run-routine-job.yml

name: Routine Scraper & Formatter - 3 Day Interval

# Controls when the action will run. 
on:

  push:
    branches:
      - '**' # This makes it run on a push to ANY branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs the job on a schedule (e.g., every 3 days at 1:00 AM UTC)
  schedule:
    - cron: '0 1 */3 * *' # This is 7 AM in Bangladesh Standard Time (UTC+6)

jobs:
  build-and-run:
    runs-on: ubuntu-latest # Use a standard Linux virtual machine

    steps:
    # 1. Checkout your repository code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # Choose a Python version

    # 3. Install dependencies from requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Recreate credential files from GitHub Secrets
    - name: Create credential files from secrets
      env:
        UCAM_CREDS: ${{ secrets.UCAM_LOGIN_CREDENTIALS }}
        TEACHER_CREDS: ${{ secrets.TEACHER_CONTACT_DETAILS }}
        GCP_SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        GCP_OAUTH: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        TOKEN_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
      run: |
        # Create directories
        mkdir -p configs_to_edit
        mkdir -p google_cloud_keys

        # Safely write environment variables to files
        echo "$UCAM_CREDS" > configs_to_edit/ucam_login_credentials.json
        echo "$TEACHER_CREDS" > configs_to_edit/teacher_contact_details.json
        echo "$GCP_SA" > google_cloud_keys/service_account_key.json
        echo "$GCP_OAUTH" > google_cloud_keys/oauth_client_secret.json
        
        # Decode the token
        echo "$TOKEN_B64" | base64 --decode > token.pickle
        
    # NEW STEP: Install the virtual display server
    - name: Install Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

    # MODIFIED STEP: Wrap the python execution in xvfb-run
    - name: Run Routine Scraper
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python routine_scrapper.py

    # 6. Run the Google Sheet formatter script
    - name: Run GSheet Formatter
      run: python gsheet_formatter.py